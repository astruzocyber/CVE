  # Veeam: backup servers are the first thing ransomware crews go after (CISA
  # KEV: CVE-2023-27532, CVE-2024-40711, both known ransomware use). One word
  # covers every product (Backup & Replication, ONE, Service Provider Console,
  # Agents, Enterprise Manager, Software Appliance, Kasten by Veeam).
  - "Veeam"
  - "Kasten"

# Exact-phrase description matches that bypass cvss_minimum: identity, trust and
# user-delivered-file bypass components where even a "Medium" CVE matters
# (e.g. CVE-2026-69982, AD FS security-feature bypass, CVSS 5.9).
priority_keywords:
  - "Active Directory Federation Services"
  - "Mark of the Web"
  - "Windows SmartScreen"
  - "Microsoft Entra"
  - "Active Directory Certificate Services"
  - "ADSelfService Plus"
  - "Global Secure Access"
  # Every Veeam CVE regardless of CVSS: low volume (~10-20/yr) and Medium ones
  # still matter on a backup server, e.g. CVE-2026-93026 (6.1) lets a Backup
  # Viewer delete the Enterprise Manager master key (= unrecoverable backups).
  - "Veeam"

# GitHub repos to check via the Dependabot Alerts API (needs GH_DEPENDABOT_TOKEN secret
# with security_events read scope on each repo listed).
dependabot_repos:
  - "astruzocyber/CVE"

# If true, only surface CVEs that are in the CISA KEV catalog OR have a high EPSS score
# (>= 0.5), cutting noise significantly. User chose false: alert on any watchlist match
# regardless of KEV/EPSS status.
require_kev_or_high_epss: false

# EPSS threshold used only when require_kev_or_high_epss is true.
epss_high_threshold: 0.5

# GitHub Security Advisories (GHSA) package names to check via the /advisories?affects=
# endpoint. This covers OPEN-SOURCE ECOSYSTEM PACKAGES (npm, PyPI, Go, Maven, RubyGems,
# etc.) and is often faster than NVD for library-level CVEs. These must be exact package
# names as published to their ecosystem (e.g. "lodash", "django", "log4j-core"), NOT
# vendor/product pairs. Left empty by default -- add real package names you depend on.
ghsa_packages: []
