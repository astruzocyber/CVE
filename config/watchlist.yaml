# Watchlist configuration for the CVE/KEV/Dependabot alert dashboard.
# Edit this file any time to tune signal-to-noise; changes take effect on the next scheduled run.

cvss_minimum: 7.0

# Vendor/product pairs use NVD's CPE vendor/product naming (lowercase, hyphens for spaces).
# Populated with a broad set of major, widely-deployed vendors/products since GFR Media
# (like most media/publishing orgs) commonly runs on web/CMS/infrastructure stacks such as
# WordPress, nginx, PHP, and common cloud/OS/office software. Adjust freely once you see
# real results in Phase 7 — narrow this down to what you actually run.
vendors_products:
  - vendor: "microsoft"
    product: "windows"
  - vendor: "microsoft"
    product: "office"
  - vendor: "microsoft"
    product: "exchange_server"
  - vendor: "apache"
    product: "http_server"
  - vendor: "apache"
    product: "log4j"
  - vendor: "apache"
    product: "tomcat"
  - vendor: "nginx"
    product: "nginx"
  - vendor: "wordpress"
    product: "wordpress"
  - vendor: "php"
    product: "php"
  - vendor: "oracle"
    product: "mysql"
  - vendor: "adobe"
    product: "acrobat_reader_dc"
  - vendor: "cisco"
    product: "ios"
  - vendor: "fortinet"
    product: "fortios"
  - vendor: "vmware"
    product: "vcenter_server"
  - vendor: "google"
    product: "chrome"
  - vendor: "mozilla"
    product: "firefox"
  - vendor: "openssl"
    product: "openssl"
  - vendor: "linux"
    product: "linux_kernel"
  - vendor: "amazon"
    product: "aws"
  - vendor: "cloudflare"
    product: "cloudflare"

# Free-text keyword matches against CVE descriptions (case-insensitive substring match).
# Kept deliberately narrow -- broad terms like "media" or "cdn" match unrelated CVEs
# (e.g. Linux kernel "media" driver code, SIP "media" transport) and create noise.
keywords:
  - "wordpress"
  - "wp plugin"
  - "wp-content"
  - "content management system"
  - "cloudflare"
  # Microsoft component names. NVD keywordSearch ANDs every word against the
  # CVE description, and Microsoft's descriptions name the component
  # ("... in Windows Shell allows ...") but rarely the word "Microsoft" -- so
  # the "microsoft windows" vendor/product pair above misses most Patch
  # Tuesday CVEs. These terms match how Microsoft actually words them.
  - "Windows Shell"
  - "Windows SmartScreen"
  - "Windows Kernel"
  - "Windows Kerberos"
  - "Windows NTLM"
  - "Windows Remote Desktop"
  - "Windows Common Log File System"
  - "Windows Hyper-V"
  - "Windows Win32k"
  - "Microsoft Exchange Server"
  - "Exchange Online"
  - "Microsoft SharePoint"
  - "Microsoft Outlook"
  - "Microsoft Office"
  - "Microsoft Teams"
  - "Microsoft Edge"
  - "Microsoft Defender"
  - "Azure Virtual Desktop"
  # Perimeter / email stack seen in the SOC (Palo Alto, Fortinet, Check Point/Avanan).
  - "PAN-OS"
  - "GlobalProtect"
  - "FortiGate"
  - "FortiClient"
  - "Check Point"
  # GFR Media / LinkActiv app inventory (2026-10-17). Broad NVD keyword terms;
  # the environment board (config/environment.yaml) does the precise matching.
  - "Fortinet"
  - "Palo Alto Networks"
  - "Cortex XDR"
  - "Meraki"
  - "Peplink"
  - "SonicWall"
  - "Citrix Workspace"
  - "3CX"
  - "AnyDesk"
  - "BeyondTrust"
  - "Zoho Assist"
  - "ManageEngine"
  - "Devolutions"
  - "ScaleFT"
  - "Bitwarden"
  - "Vaultwarden"
  - "Keeper Security"
  - "Nextcloud"
  - "pgAdmin"
  - "stunnel"
  - "Vim"
  - "Pale Moon"
  - "Vivaldi"
  - "WebView2"
  - "Zoom"
  - "Telegram Desktop"
  - "WeChat"
  - "KakaoTalk"
  - "PRTG"
  - "Site24x7"
  - "Avaya"
  - "Grandstream"
  - "Nutanix"
  - "VMware"
  - "Sophos"
  - "Intune"
  - "Power Automate"
  - "Power BI"
  - "Slack"
  - "GitHub Enterprise"
  - "Bitbucket"
  - "Atlassian"
  - "Confluence"
  - "Jira"
  - "Tableau"
  - "OnBase"
  - "Acumatica"
  - "DocuSign"
  - "HubSpot"
  - "Five9"
  - "Dell Command"
  - "Remote Desktop Manager"
  - "Global Secure Access"
  - "OpenTelemetry Collector"
  - "Adobe Acrobat"
  - "Adobe InDesign"
  - "K-Lite"
  - "Free Download Manager"
  - "4K Video Downloader"
  - "BurnAware"
