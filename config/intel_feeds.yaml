# Threat-intel news / advisory feeds ingested by scripts/fetch_intel.py.
#
# Why: the CVE pipeline only sees what NVD/KEV/GHSA/Dependabot publish, so it
# structurally cannot surface social-engineering campaigns (e.g. Microsoft
# Teams "IT support" vishing), vendor operational issues (e.g. a Windows
# update causing black screens), or news that a CVE is being exploited before
# CISA lists it. These feeds fill that gap. All are free, public RSS/Atom.
#
# A feed that errors is skipped for that run (logged, never fatal); items
# already collected stay on the board until they age out (retention_days).
retention_days: 45   # was 30; longer memory for slow-burn campaigns
max_items: 1500      # was 600; room for the vendor/research feeds below

feeds:
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
  - name: SANS ISC
    url: https://isc.sans.edu/rssfeed_full.xml
  - name: Dark Reading
    url: https://www.darkreading.com/rss.xml
  - name: SecurityWeek
    url: https://www.securityweek.com/feed/
  - name: Help Net Security
    url: https://www.helpnetsecurity.com/feed/
  - name: The Register
    url: https://www.theregister.com/security/headlines.atom
  - name: Microsoft Security Blog
    url: https://www.microsoft.com/en-us/security/blog/feed/
  - name: CISA Advisories
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
  - name: Cyber Security News
    url: https://cybersecuritynews.com/feed/
  - name: GBHackers
    url: https://gbhackers.com/feed/
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/

  # ---- Vendor PSIRTs for our perimeter / estate (probed 2026-10-17) ----
  - name: Fortinet PSIRT
    url: https://filestore.fortinet.com/fortiguard/rss/ir.xml
  - name: Palo Alto PSIRT
    url: https://security.paloaltonetworks.com/rss.xml
  - name: Cisco PSIRT
    url: https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml
  - name: CERT/CC
    url: https://www.kb.cert.org/vuls/atomfeed/
  - name: Zero Day Initiative
    url: https://www.zerodayinitiative.com/rss/published/

  # ---- Veeam (backup & recovery: the #1 ransomware pre-encryption target) ----
  # Official KB security feed (probed 2026-10-20): one Atom entry per
  # "Vulnerabilities Resolved in <product> <build>" bulletin. advisory: true
  # makes fetch_intel.py read the CVE table in <content> (vendor severity +
  # CVSS per CVE); the feed's <summary> is only the title. Bulletins stay on
  # the board for a year because the exposure lasts until the server is patched.
  - name: Veeam Security KB
    url: https://www.veeam.com/services/open/kb/security-feed
    advisory: true
    retention_days: 365

  # ---- Threat research (campaigns, initial access, exploitation write-ups) ----
  - name: Unit 42
    url: https://unit42.paloaltonetworks.com/feed/
  - name: Cisco Talos
    url: https://blog.talosintelligence.com/rss/
  - name: Check Point Research
    url: https://research.checkpoint.com/feed/
  - name: Huntress
    url: https://www.huntress.com/blog/rss.xml
  - name: Rapid7
    url: https://www.rapid7.com/blog/rss/
  - name: watchTowr Labs
    url: https://labs.watchtowr.com/rss/
  - name: Security Affairs
    url: https://securityaffairs.com/feed
  - name: The Record
    url: https://therecord.media/feed
  - name: Cloudflare Security
    url: https://blog.cloudflare.com/tag/security/rss/

  # ---- Google News searches: reach outlets whose own feeds are bot-blocked,
  # and catch estate-specific campaigns (Teams vishing etc.) as soon as any
  # outlet reports them. Each item links to the original article.
  - name: "GNews: Teams / help-desk vishing"
    url: "https://news.google.com/rss/search?q=%28%22Microsoft+Teams%22+OR+%22Teams%22%29+%28vishing+OR+%22help+desk%22+OR+%22IT+support%22%29+%28phishing+OR+attack+OR+scam%29+when%3A7d&hl=en-US&gl=US&ceid=US%3Aen"
  - name: "GNews: estate perimeter exploited"
    url: "https://news.google.com/rss/search?q=%28Fortinet+OR+FortiGate+OR+%22Palo+Alto%22+OR+GlobalProtect+OR+%22Check+Point%22+OR+SonicWall+OR+Meraki+OR+Peplink+OR+Citrix%29+%28exploited+OR+%22zero-day%22+OR+%22actively+exploited%22%29+when%3A7d&hl=en-US&gl=US&ceid=US%3Aen"
