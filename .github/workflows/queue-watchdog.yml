name: Aggregation Queue Watchdog

# Incident this addresses (2026-09-13/14): the aggregation workflow's
# `concurrency: {group: cve-aggregation, cancel-in-progress: false}` guard
# (cycle 101) plus `timeout-minutes: 10` on the job itself (cycle 102) only
# bound how long a run may execute once a GitHub-hosted runner picks it up.
# Neither bounds how long a run may sit in `queued` state *before* a runner
# picks it up. A run that never gets a runner (a transient GitHub Actions
# scheduling hiccup, observed in production: run 34737259541 sat queued for
# >20 hours) blocks the whole `cve-aggregation` concurrency group, so every
# subsequent scheduled trigger during that window also queues up behind it
# and never runs -- data silently went stale for ~24h with zero self-
# recovery until a human manually cancelled the stuck run.
#
# This workaround runs independently (its own workflow, no shared
# concurrency group with cve-alerts.yml) on a tighter cadence and cancels
# any queued cve-alerts.yml run older than QUEUE_TIMEOUT_MINUTES, freeing
# the group so the next scheduled/dispatch trigger can actually execute.
# Cancelling a merely-queued (not yet started) run is always safe: it has
# not fetched any data or made any API calls yet, so nothing is lost.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write

env:
  QUEUE_TIMEOUT_MINUTES: "30"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stuck queued aggregation runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          cutoff_epoch=$(( $(date -u +%s) - QUEUE_TIMEOUT_MINUTES * 60 ))

          runs=$(gh api "repos/${repo}/actions/workflows/cve-alerts.yml/runs?status=queued&per_page=20" \
                   --jq '.workflow_runs[] | [.id, .created_at] | @tsv')

          if [ -z "$runs" ]; then
            echo "No queued aggregation runs found. Nothing to do."
            exit 0
          fi

          echo "$runs" | while IFS=$'\t' read -r run_id created_at; do
            created_epoch=$(date -u -d "$created_at" +%s)
            age_minutes=$(( ($(date -u +%s) - created_epoch) / 60 ))
            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "::warning::Run $run_id has been queued for ${age_minutes}m (> ${QUEUE_TIMEOUT_MINUTES}m threshold, created $created_at) -- cancelling to unblock the cve-aggregation concurrency group."
              gh api -X POST "repos/${repo}/actions/runs/${run_id}/cancel" || \
                echo "::error::Failed to cancel run $run_id (it may have started or completed between listing and cancel)."
            else
              echo "Run $run_id queued for ${age_minutes}m, still within the ${QUEUE_TIMEOUT_MINUTES}m threshold. Leaving it."
            fi
          done
