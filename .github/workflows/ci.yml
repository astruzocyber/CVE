name: CI Data & Frontend Validation

# Independent, always-on regression guard: runs on every push/PR touching
# docs/ or scripts/, regardless of the aggregation pipeline's own 4-hour
# schedule. Prior to this workflow, the only safety net against a broken
# commit reaching the live GitHub Pages site was this project's own
# per-cycle manual validation (local scratch server + spot checks) -- there
# was no automated check that ran unconditionally on every push. This closes
# that gap at zero cost (public repo = unlimited free Actions minutes).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded runs on the same ref: this repo's autonomous improver
# pushes to main roughly every 30 minutes, and each push re-triggers this
# workflow. Without concurrency control, a burst of pushes (e.g. manual
# intervention plus the next scheduled cycle landing close together) queues
# redundant validation runs for commits that are already stale by the time
# they'd start. Cost is already zero either way (public repo = unlimited
# free Actions minutes), but this avoids queue buildup and gets the
# validation result for the latest commit back faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Syntax-check pipeline scripts
        run: |
          python -m py_compile scripts/aggregate.py scripts/notify_github_issues.py scripts/validate_data.py

      - name: Syntax-check frontend JS
        run: |
          node --check docs/app.js

      - name: Validate committed data files against schema
        run: python scripts/validate_data.py

      - name: Unit tests for scoring/parsing logic (aggregate.py)
        run: python -m unittest discover -s scripts -p "test_*.py" -v
