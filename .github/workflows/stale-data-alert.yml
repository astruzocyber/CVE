name: Stale Data Alert

# Server-side companion to the client-side stale banner (docs/js/overview.js
# checkStaleness(), cycle 9). That banner only warns a visitor who happens
# to load the dashboard during a stale window -- nobody is notified during
# the (potentially many) hours before the next page load. The 2026-09-13
# incident (aggregation stuck ~24h, see cancel-stale-queued.yml) showed
# this gap concretely: the underlying pipeline stall was only discovered
# and fixed by a human/agent manually inspecting run history, not by any
# automated alert.
#
# This workflow runs independently of the aggregation pipeline (its own
# concurrency group, read-only w.r.t. data) and periodically checks
# docs/data/stats.json's generated_at timestamp on the live main branch.
# If the data is older than STALE_THRESHOLD_HOURS, it opens (or leaves
# open) a single GitHub Issue tagged data-staleness -- deduplicated by
# checking for an existing open issue with that label first, so repeated
# stale checks don't spam new issues every 30 minutes. Once the pipeline
# recovers and produces fresh data, this workflow auto-closes any open
# staleness issue it previously filed.
#
# Zero cost: native Actions schedule + GITHUB_TOKEN issue API, no new
# secrets, no external services, runs in a few seconds.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: stale-data-alert
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  STALE_THRESHOLD_HOURS: 20

jobs:
  check-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check stats.json freshness and file/close a staleness issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ ! -f docs/data/stats.json ]; then
            echo "::warning::docs/data/stats.json not found -- skipping staleness check."
            exit 0
          fi

          GENERATED_AT=$(python3 -c "import json; print(json.load(open('docs/data/stats.json')).get('generated_at',''))")
          if [ -z "${GENERATED_AT}" ]; then
            echo "::warning::stats.json has no generated_at field -- skipping staleness check."
            exit 0
          fi

          GENERATED_EPOCH=$(date -u -d "${GENERATED_AT}" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_HOURS=$(( (NOW_EPOCH - GENERATED_EPOCH) / 3600 ))
          THRESHOLD="${STALE_THRESHOLD_HOURS}"

          echo "stats.json generated_at=${GENERATED_AT}, age=${AGE_HOURS}h, threshold=${THRESHOLD}h"

          # The escalation board (escalate.py) and threat-intel feed (fetch_intel.py)
          # run as continue-on-error steps, so a crash (or every news feed failing)
          # leaves their file frozen while the job stays green and stats.json stays
          # fresh. Track the oldest of the three so that silent failure is noticed.
          WORST_FILE="stats.json"
          WORST_AT="${GENERATED_AT}"
          for f in escalations.json intel.json; do
            [ -f "docs/data/${f}" ] || continue
            AT=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('generated_at',''))" "docs/data/${f}" 2>/dev/null || true)
            if [ -z "${AT}" ]; then
              echo "::warning::docs/data/${f} has no readable generated_at -- not checked."
              continue
            fi
            AT_EPOCH=$(date -u -d "${AT}" +%s)
            AGE=$(( (NOW_EPOCH - AT_EPOCH) / 3600 ))
            echo "${f} generated_at=${AT}, age=${AGE}h"
            if [ "${AGE}" -gt "${AGE_HOURS}" ]; then
              AGE_HOURS="${AGE}"
              WORST_FILE="${f}"
              WORST_AT="${AT}"
            fi
          done

          EXISTING_ISSUE=$(gh api "repos/${REPO}/issues?state=open&labels=data-staleness&per_page=5" --jq '.[0].number // empty')

          if [ "${AGE_HOURS}" -ge "${THRESHOLD}" ]; then
            if [ -n "${EXISTING_ISSUE}" ]; then
              echo "Data is stale (${AGE_HOURS}h >= ${THRESHOLD}h) -- issue #${EXISTING_ISSUE} already open, leaving it."
            else
              echo "Data is stale (${AGE_HOURS}h >= ${THRESHOLD}h) -- filing a new issue."
              BODY_FILE=$(mktemp)
              {
                echo "The oldest dashboard data file, docs/data/${WORST_FILE}, was last refreshed (generated_at) at **${WORST_AT}**, which is now ${AGE_HOURS} hours ago -- past the ${THRESHOLD}h staleness threshold (the aggregation is scheduled every 2h, so this means many missed or failed runs)."
                echo ""
                if [ "${WORST_FILE}" != "stats.json" ]; then
                  echo "stats.json itself is fresh (generated_at ${GENERATED_AT}), so the aggregation is running but the never-fatal step that writes ${WORST_FILE} is crashing or keeping its previous output (escalations.json: 'Tier items for this environment'; intel.json: 'Fetch threat-intel news feeds'). Check that step's log in the latest run: https://github.com/${REPO}/actions/workflows/cve-alerts.yml"
                  echo ""
                fi
                echo "This usually means the CVE/KEV/Dependabot Alert Aggregation workflow has stopped running, is failing, or a run is stuck queued (see cancel-stale-queued.yml). Check: https://github.com/${REPO}/actions/workflows/cve-alerts.yml"
                echo ""
                echo "This issue was filed automatically and will auto-close once fresh data is detected."
              } > "${BODY_FILE}"
              gh api "repos/${REPO}/issues" -X POST \
                -f title="Dashboard data is stale (${AGE_HOURS}h since last update)" \
                -F body=@"${BODY_FILE}" \
                -f "labels[]=data-staleness" >/dev/null
            fi
          else
            echo "Data is fresh (${AGE_HOURS}h < ${THRESHOLD}h)."
            if [ -n "${EXISTING_ISSUE}" ]; then
              echo "Closing previously-open staleness issue #${EXISTING_ISSUE} (data has recovered)."
              gh api "repos/${REPO}/issues/${EXISTING_ISSUE}" -X PATCH -f state=closed >/dev/null
              gh api "repos/${REPO}/issues/${EXISTING_ISSUE}/comments" -X POST \
                -f body="Data is fresh again as of this check (oldest file ${WORST_FILE}, generated_at=${WORST_AT}, age=${AGE_HOURS}h). Auto-closing." >/dev/null
            fi
          fi
